# ═══════════════════════════════════════════════════════════════════════
# ETL Buk → Supabase | Scheduler automatizado
# ─────────────────────────────────────────────────────────────────────
# Corre main_v2.py de forma programada en la infraestructura de GitHub.
# Cero dependencia de PC local. Los logs se guardan como artifact.
#
# Autor: Juan Montoya — Electroingeniería S.A.S. — 2026
# ═══════════════════════════════════════════════════════════════════════

name: ETL Buk → Supabase

# ─── Triggers ──────────────────────────────────────────────────────────
on:
  # Ejecución programada: 6 AM y 6 PM hora Colombia (UTC-5)
  # GitHub Actions usa UTC, por eso: 11 UTC = 6 AM COL, 23 UTC = 6 PM COL
  schedule:
    - cron: '0 11,23 * * *'

  # Ejecución manual desde la pestaña "Actions" de GitHub
  workflow_dispatch:
    inputs:
      backfill:
        description: 'Forzar BACKFILL (90 días). Por defecto corre INCREMENTAL (5 días).'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

# ─── Permisos mínimos ──────────────────────────────────────────────────
permissions:
  contents: read

# ─── Jobs ──────────────────────────────────────────────────────────────
jobs:
  ejecutar-etl:
    name: Sincronizar Buk con Supabase
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      # 1. Bajar el código del repo
      - name: 📥 Checkout del repositorio
        uses: actions/checkout@v4

      # 2. Instalar Python 3.11 con caché de pip
      - name: 🐍 Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      # 3. Instalar dependencias del requirements.txt
      - name: 📦 Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 4. Ejecutar el ETL con los secrets como variables de entorno
      - name: 🚀 Ejecutar ETL (main_v2.py)
        env:
          BUK_TOKEN:            ${{ secrets.BUK_TOKEN }}
          BASE_URL:             ${{ secrets.BASE_URL }}
          BUK_ASISTENCIA_TOKEN: ${{ secrets.BUK_ASISTENCIA_TOKEN }}
          URL_ASISTENCIA:       ${{ secrets.URL_ASISTENCIA }}
          SUPABASE_DB_URL:      ${{ secrets.SUPABASE_DB_URL }}
          # Si el trigger fue manual con backfill=true → pasa "1", si no → vacío
          BACKFILL: ${{ github.event.inputs.backfill == 'true' && '1' || '' }}
          # Fuerza UTF-8 para evitar problemas con los emojis del log en Linux
          PYTHONIOENCODING: utf-8
        run: python main_v2.py

      # 5. Subir los logs como artifact (aunque falle el ETL)
      #    Se pueden descargar desde la pestaña Actions durante 14 días
      - name: 📋 Subir logs como artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: etl-logs-run-${{ github.run_number }}
          path: logs/
          retention-days: 14
          if-no-files-found: warn
